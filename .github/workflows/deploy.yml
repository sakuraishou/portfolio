name: Deploy Portfolio

# ↓ ここが「ボタンポチ」の設定
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 220.158.19.199
          username: shou
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # ↓ ここに、サーバーで実行したいコマンドを書く
          script: |
            set -e
            cd /var/www/my-apps/portfolio
            # force push や履歴整理があっても止まらないよう、pull ではなく origin へ強制一致させる
            # （このリポジトリはVPS上で直接編集しない運用。media/ と .env は追跡外なので影響しない）
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build
